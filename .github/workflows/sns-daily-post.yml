name: 영농사업화 SNS 자동 포스팅

on:
  schedule:
    # 매일 20:30 KST (UTC 11:30)
    - cron: "30 11 * * *"
  workflow_dispatch:  # 수동 실행

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests

      - name: SNS 자동 포스팅
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          HANALL_LINK: ${{ secrets.HANALL_LINK }}
          PLATFORM_LINK: https://youngnong.example.com
        working-directory: sns-automation
        run: python sns_bot.py post all
